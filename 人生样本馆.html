const stage = document.getElementById("stage");
const fmt = n => (n==null?"—":(n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString("en-US"));
const HEALTH_LABEL = {1:"健康优秀",2:"健康良好",3:"健康一般",4:"健康较差",5:"健康很差"};
const SATIS_LABEL = {1:"很满意",2:"比较满意",3:"一般",4:"不太满意",5:"很不满意"};

function storyOf(pts){
  const parts = [];
  const first = pts[0], last = pts[pts.length-1];
  const w89 = pts.find(p=>p.y===1989), w99 = pts.find(p=>p.y===1999), w23 = pts.find(p=>p.y===2023);
  parts.push(`1969 年，户主 ${first.age!=null?Math.round(first.age)+" 岁":"?"}，${first.st||"某州"}，${first.own||"住房不详"}。${first.inc!=null?`当年收入 ${fmt(first.inc)}（≈2024 年 ${fmt(first.inc24)}）`:""}。`);
  if(w89 && w23 && w89.w!=null && w23.w!=null){
    const mult = w23.w / Math.max(1, w89.w);
    if(mult>8) parts.push(`${w89.y}→${w23.y}，净资产从 ${fmt(w89.w)} 涨到 <b>${fmt(w23.w)}</b>——${mult.toFixed(0)} 倍。`);
    else if(mult>=2) parts.push(`净资产从 ${fmt(w89.w)} 稳步增长到 ${fmt(w23.w)}。`);
    else if(w23.w<0) parts.push(`直到 ${w23.y} 仍是<b>负资产</b>——54 年没攒下钱。`);
    else if(mult<1 && w89.w>0) parts.push(`净资产从 ${fmt(w89.w)} 缩水到 ${fmt(w23.w)}——有些年头，把财富带走了。`);
  }
  const hl = pts.filter(p=>p.health && HEALTH_LABEL[p.health]);
  if(hl.length>=2){
    const r1 = hl[0].health, r2 = hl[hl.length-1].health;
    const rank={1:5,2:4,3:3,4:2,5:1};
    if(rank[r1]>rank[r2]) parts.push(`健康从「${HEALTH_LABEL[r1]}」滑到「${HEALTH_LABEL[r2]}」——大多数人的晚年曲线。`);
  }
  const st = pts.filter(p=>p.satis && SATIS_LABEL[p.satis]);
  if(st.length) parts.push(`${st[st.length-1].y} 年自评「${SATIS_LABEL[st[st.length-1].satis]}」。`);
  return parts.join("");
}

  "高开低走": "离婚率 62%（六类最高），收入腰斩，房子从 93% 跌到 20%——人生被婚姻和收入断裂打穿。",
  "大起大落": "房子从 78% 跌到 11%，丧偶率 57%——巅峰之后，什么都没留下。",
  "普通中产": "有房（84%）有存款（金融 20%），不温不火——这是大多数人的样子。",
  "低财富": "1969 年只有 31% 的人有房，2023 年跌到 13%——起跑线就没上车，两头空。",
};
function cfgHTML(c){
  if(!c) return "";
  const bar = (label, v, color)=>{
    return `<div style="margin-top:5px;"><div style="font-size:11px;color:var(--sub);">${label} ${v}%</div><div style="height:6px;background:#eee3cd;border-radius:3px;position:relative;"><i style="position:absolute;left:0;top:0;bottom:0;width:${Math.min(100,v)}%;background:${color};border-radius:3px;"></i></div></div>`;
  };
  return `<div style="margin-top:10px;background:#f7f1e2;border-radius:8px;padding:10px 12px;">
    <div style="font-size:12.5px;font-weight:700;margin-bottom:4px;">📊 这类家庭的资产画像（${c.n} 户）</div>
    ${bar("金融资产占 " + c.fin_share + "%", c.fin_share, "#3a5f8a")}
    ${bar("房产净值占 " + (100-c.fin_share) + "%", 100-c.fin_share, "#c62f2f")}
    <div style="font-size:11.5px;color:var(--ink);margin-top:6px;line-height:1.7;">住房拥有：${c.own_1969}% → ${c.own_1989}% → <b>${c.own_2023}%</b> ｜ 离婚率 <b>${c.divorce_rate}%</b> ｜ 丧偶率 ${c.widow_rate}% ｜ 收入变化 ×${c.inc_mult}</div>
  </div>`;
}
function renderType(t, ti){
  const samples = t.samples.map((s, si)=>{
    const pts = s.pts;
    const items = pts.map(p=>{
      const badges = [];
      if(p.age!=null) badges.push(`户主 ${Math.round(p.age)} 岁`);
      if(p.mar) badges.push(p.mar);
      if(p.st) badges.push(p.st);
      if(p.own) badges.push(p.own);
      if(p.hc) badges.push("🔁换户主");
      if(p.health && HEALTH_LABEL[p.health]) badges.push(`🩺${HEALTH_LABEL[p.health]}`);
      if(p.satis && SATIS_LABEL[p.satis]) badges.push(`😊${SATIS_LABEL[p.satis]}`);
      return `<div class="tl-item"><span class="tl-year">${p.y}</span> ${badges.map(b=>`<span class="tl-badge">${b}</span>`).join("")}
        <div class="tl-row">${p.inc!=null?`收入 <span class="big">${fmt(p.inc)}</span> <span class="m">(当时)</span> <span class="conv">≈ ${fmt(p.inc24)}</span> ｜ `:""}${p.w!=null?`净资产 <span class="big ${p.w<0?"neg":"pos"}">${fmt(p.w)}</span> <span class="conv">≈ ${fmt(p.w24)}</span>`:""}</div></div>`;
    }).join("");
    return `<div class="sample ${si===0?"show":""}" id="s${ti}_${si}">
      <div class="sh">样本 ${si+1} · 家族 #${s.id.replace(".0","")}（代表性 ${s.score}）</div>
      <div class="tl">${items}</div>
      <div class="story">${storyOf(pts)}</div>
    </div>`;
  }).join("");
  const barW = Math.min(100, t.ratio);
  return `<div class="type" onclick="toggleType(${ti})">
    <div class="th"><span class="ic">${t.icon}</span><h3>${t.label}</h3><span class="n">${t.count} 户 · ${t.ratio}%</span></div>
    <div class="td">${t.desc}</div>
    ${cfgHTML(t.cfg)}
    ${CFG_INSIGHT[t.label]?`<div class="note" style="color:var(--ink); font-size:12px; margin-top:6px;">💡 ${CFG_INSIGHT[t.label]}</div>`:""}
    <div class="bar"><i style="width:${barW}%"></i></div>
    ${samples}
    ${t.samples.length>1?`<div class="note" style="text-align:center;">点击卡片切换样本（${t.samples.length} 个代表）</div>`:""}
  </div>`;
}
function toggleType(ti){
  const type = document.querySelectorAll(".type")[ti];
  const samples = type.querySelectorAll(".sample");
  const shown = [...samples].findIndex(s=>s.classList.contains("show"));
  samples.forEach(s=>s.classList.remove("show"));
  samples[(shown+1)%samples.length].classList.add("show");
}

function screen(){
  const types = SAMPLES.types.map((t,ti)=>renderType(t,ti)).join("");
  render(`
    <div class="card">
      <h2 style="font-size:15px;">美国的六种活法（1,832 个家庭 54 年）</h2>
      <div class="note" style="font-size:12px;">从 1969 年收入五等分出发，54 年后财富分成了六种人生形态。点击每种，看它的典型样本——一个真实家庭的一生。</div>
      ${types}
    </div>
    <div class="cta">
      <a class="btn btn-primary" href="真实人生档案.html">🎲 看完样本，去翻真实档案</a>
    </div>`);
}
function render(html){ stage.innerHTML = html; }
screen();
</script>
</body>
</html>
