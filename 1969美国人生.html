  .opt:hover{background:#faf0dc; border-color:var(--red); transform:translateY(-1px);}
  .opt .o{font-weight:700;}
  .opt .hint{display:block; font-size:11.5px; color:var(--sub); margin-top:2px;}
  .opt .pv{display:block; font-size:12px; color:var(--blue); margin-top:3px; font-weight:700;}
  .btn{display:inline-block; border:none; border-radius:8px; padding:11px 18px; font-size:14px; cursor:pointer; font-family:inherit; margin:4px 4px 0 0;}
  .btn-primary{background:var(--red); color:#fff;}

  .note{font-size:11px; color:var(--sub); line-height:1.7; margin-top:8px;}

  .era b{color:var(--gold);}
  .era .v{display:inline-block; background:#fff; border:1px solid var(--line); border-radius:4px; padding:0 6px; margin:2px 3px 0 0; font-size:11.5px;}
  /* 年轮 */
  .log{font-size:12.5px; line-height:1.8;}
  .log .row{display:flex; gap:8px; padding:2px 0; border-bottom:1px dashed #efe3cc;}
  .log .age{color:var(--sub); min-width:52px; flex:none;}
  .log .ev{color:var(--blue);} .log .ev.warn{color:var(--red);} .log .ev.good{color:var(--green);}

  .big-num small{font-size:13px; font-weight:400;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
  .stat{background:#faf3e4; border:1px solid var(--line); border-radius:8px; padding:10px 12px;}
  .stat .k{font-size:11px; color:var(--sub);}
  .stat .v{font-size:16px; font-weight:700; margin-top:2px;}
  .stat .v small{font-size:11px; font-weight:400; color:var(--sub);}
  .cf{margin-top:10px; border-top:1px dashed var(--line); padding-top:8px;}

  .cf .cfr .up{color:var(--green); font-weight:700;} .cf .cfr .dn{color:var(--red); font-weight:700;}
  canvas{width:100%; height:180px; display:block; margin-top:10px; background:#fffdf7; border:1px solid var(--line); border-radius:8px;}
  .qsel{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:10px;}
  .qsel .qc{border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 4px; text-align:center; cursor:pointer; font-size:11px; font-family:inherit; color:var(--ink); line-height:1.5;}

  .qsel .qc .qn{font-weight:700; color:var(--red); font-size:12px;}
  .foot{text-align:center; font-size:11px; color:var(--sub); margin-top:16px; line-height:1.8;}
  .toast{position:fixed; left:50%; bottom:64px; transform:translateX(-50%); max-width:88%;

async function startGame(q){
  S = newState();
  S.q = q;
  S.income = Math.max(QUANT[q].med, 3200); // 22岁劳动者起薪（1969最低工资兜底）
  // 学历
  render(`
    <div class="card">
      <h2>第二步 · 你的学历</h2>
      <div class="desc">1969 年，25-34 岁美国人约 60% 高中毕业、15% 大学毕业。学历决定起薪与天花板。</div>
      ${Object.entries(EDU).map(([k,v],i)=>`<button class="opt" data-i="${i}"><span class="o">${k}</span><span class="hint">起薪系数 ×${v}（1969 年大学溢价很高）</span></button>`).join("")}
    </div>`);
  const ei = await waitChoice();
  S.edu = Object.keys(EDU)[ei];
  // 职业
  render(`
    <div class="card">
      <h2>第三步 · 你的职业</h2>
      <div class="desc">1969 年的美国经济正在黄金期，但 1970s 的滞胀即将到来。</div>
      ${Object.entries(JOB).map(([k,v],i)=>`<button class="opt" data-i="${i}"><span class="o">${k}</span><span class="hint">${v.desc} ｜ 实际涨薪 ${(v.grow*100).toFixed(1)}%/年</span></button>`).join("")}
    </div>`);
  const ji = await waitChoice();
  S.job = Object.keys(JOB)[ji];
  const mult = EDU[S.edu] * JOB[S.job].coef;
  S.income = Math.round(S.income * mult);
  await play();
}

const DEF_INVEST = {invest79:0, invest87:1, invest95:0, exit2000:0, invest15:0, covid:1};

function applyChoice(st, idx, slot){
  switch(slot){
    case "marry": if(idx===0) st.married=true; break;
    case "kid": if(idx===0) st.kid=true; break;
    case "house1": if(idx===0) buyHouse(st); break;
    case "invest79":
      st.invest = idx===0 ? "deposit" : "balanced";
      break;
    case "upgrade": if(idx===1 && st.house>0) upgradeHouse(st); break;
    case "invest87":
      if(idx===0){ st.invest = st.invest==="deposit" ? "balanced" : "aggressive"; }
      break;
    case "invest95": if(idx===0) st.invest = "aggressive"; break;
    case "exit2000":
      if(idx===0){ st.cash += st.stock; st.stock = 0; st.invest = "deposit"; }
      break;
    case "invest2005": if(idx===0 && st.house>0) buySecond(st); break;
    case "crisis2008":
      if(idx===0){ st.cash += st.stock; st.stock = 0; st.invest = "deposit"; }
      if(idx===2){ st.invest = "aggressive"; }
      break;
    case "invest15": if(idx===0) st.invest = "deposit"; break;
    case "covid":
      if(idx===0){ st.cash += st.stock*0.6; st.stock *= 0.4; st.invest="deposit"; }
      if(idx===1) st.invest = "aggressive";
      break;
  }
}
function buyHouse(st){
  const price = housePrice(st.year);
  let dp = price*0.2;
  if(st.cash < dp){ dp = st.cash; }
  st.cash -= dp;
  st.house = price;
  st.loan = price - dp;
  st.rate = HIST[st.year].rate;
}
function upgradeHouse(st){
  const oldNet = st.house - st.loan;
  const newPrice = housePrice(st.year)*1.5;
  st.cash += oldNet;
  st.cash -= newPrice*0.2;
  st.house = newPrice;
  st.loan = newPrice*0.8;
  st.rate = HIST[st.year].rate;
}
function buySecond(st){
  const price = housePrice(st.year)*0.9;
  const dp = price*0.2;
  if(st.cash < dp) return;
  st.cash -= dp;
  st.house2 = price;
  st.loan2 = price - dp;
  st.rate2 = HIST[st.year].rate;
}
function housePrice(y){
  // 1969 美国中位房价 $25,600，按真实涨幅滚动
  let p = 25600;
  for(let yy=1969; yy<y; yy++) p *= (1 + HIST[yy].house/100);
  return p;
}
function annualPay(loan, rate, yearsLeft){
  if(loan<=0) return 0;
  const r = rate/100/12, n = yearsLeft*12;
  const m = loan*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
  return m*12;
}

/* ====== 年度推进（历史驱动） ====== */
function tick(st, deterministic){
  const y = st.year;
  const h = HIST[y];
  st.age++;
  // 收入：名义 = 上年 ×(1+通胀) ×(1+实际增长)
  const grow = JOB[st.job].grow + (st.job==="个体经营" ? (Math.random()*0.06-0.03) : 0);
  st.income *= (1 + h.inf/100) * (1 + grow);
  if(st.layoffLeft>0){ st.income *= 0.2; st.layoffLeft--; }
  // 失业（真实失业率驱动）
  if(!deterministic && Math.random() < h.unemp/100 * 0.6){
    st.layoffLeft = 1;
    const msg = `失业了（当年美国失业率 ${h.unemp}%），只拿失业金过了一年`;
    st.events.push({y, t:msg});
    showToast(msg, "warn");
    st.pressure += 15;
  }
  const fam = st.married ? st.income*1.6 : st.income;
  // 支出（美国式：消费率高，储蓄率低）
  let rate = st.married ? 0.82 : 0.88;
  if(st.kid) rate = 0.86;
  if(st.age > 50) rate = 0.84;
  let exp = fam * rate + (st.kid ? 3000*(1+h.inf/100) : 0);
  // 房贷
  let pay = 0;
  if(st.loan>0){ pay += annualPay(st.loan, st.rate, Math.max(1, 30-(st.year-1975))); st.loan = Math.max(0, st.loan - st.loan/30); }
  if(st.loan2>0){ pay += annualPay(st.loan2, st.rate2, Math.max(1, 30-(st.year-2005))); st.loan2 = Math.max(0, st.loan2 - st.loan2/30); }
  // 资产回报
  const depR = Math.max(1, h.rate - 2); // 存款利率 ≈ 房贷 - 2%
  st.cash *= (1 + depR/100);
  st.stock *= (1 + h.stock/100);
  // 房产增值
  st.house *= (1 + h.house/100);
  st.house2 *= (1 + h.house/100);
  // 结余分配
  const save = fam - exp - pay;
  const alloc = {deposit:[1,0], balanced:[0.5,0.5], aggressive:[0.3,0.7]}[st.invest];
  st.cash += save * alloc[0];
  st.stock += save * alloc[1];
  st.hist.push({y, age:st.age, net: st.cash+st.stock+st.house+st.house2-st.loan-st.loan2, inc:fam});
  st.year++;
}

/* ====== 主循环 ====== */
async function play(){
  let lastLog = "";
  while(S.year <= 2023){
    const y = S.year;
    for(const d of DECISIONS){
      if(d.y !== y) continue;
      if(d.cond && !d.cond(S)) continue;
      const text = typeof d.text==="string" ? d.text.replace("{P}", fmt(housePrice(y))) : d.text;
      render(`
        <div class="card">
          <h2><span class="yb">${y} 年 · ${S.age} 岁</span>${d.title}</h2>
          ${eraHTML(y)}
          <div class="desc">${text}</div>
          ${d.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="o">${o.label}</span>${o.hint?`<span class="hint">${o.hint}</span>`:""}</button>`).join("")}
          <div class="note">你只知道过去发生过什么，不知道未来会怎样——历史不会重演，但会押韵。</div>
        </div>`);
      const idx = await waitChoice();
      applyChoice(S, idx, d.slot);
      S.choiceSeq.push({y, slot:d.slot, idx, label:d.opts[idx].label, opts:d.opts.map(o=>o.label)});
      if(d.slot==="crisis2008" && idx===2) S.events.push({y, t:"你在恐慌中抄底——赌对了，这是你人生最赚的一笔"});
    }
    // 年度日志（每 4 年一屏）
    tick(S, false);
    if(S.year % 4 === 0 || S.year >= 2020){
      const net = S.hist[S.hist.length-1].net;
      const evs = S.events.splice(0).map(e=>`<div class="ev ${e.t.includes("失业")?"warn":e.t.includes("最赚")?"good":""}">· ${e.t}</div>`).join("");
      render(`<div class="card" style="padding:10px 14px;"><div class="log">
        <div class="row"><span class="age">${S.year}年</span><span>${S.age}岁 ｜ 家庭收入 ${fmt(S.income*(S.married?1.6:1))} ｜ 净资产 ${fmt(net)} ${net<0?"<span style='color:var(--red)'>⚠️ 负债</span>":""}</span></div>${evs}</div></div>`);
      lastLog = S.year;
    }
  }
  await screenResult();
}

/* 确定性跑到 2023（预览/复盘用）；choiceMap: slot→idx 覆盖默认选择 */
function simToEnd(st, choiceMap){
  while(st.year <= 2023){
    for(const d of DECISIONS){
      if(d.y !== st.year) continue;
      if(d.cond && !d.cond(st)) continue;
      const idx = (choiceMap && choiceMap[d.slot]!==undefined) ? choiceMap[d.slot]
        : (DEF_INVEST[d.slot]!==undefined ? DEF_INVEST[d.slot] : d.def);
      applyChoice(st, idx, d.slot);
    }
    tick(st, true);
  }
}

/* 事件即时弹窗 */
function showToast(text, cls){
  const t = document.createElement("div");
  t.className = "toast " + (cls||"");
  t.textContent = (cls==="warn" ? "⚠️ " : "✨ ") + text;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 4000);
}

/* ====== 结算 ====== */
function pctVsReal(q, net){
  const dist = QUANT[q].dist; // 同起点真实家庭 2023 净资产分布（升序）
  if(!dist || !dist.length) return null;
  let over = 0;
  for(const v of dist) if(v <= net) over++;
  return Math.round(over/dist.length*100);
}
function screenResult(){
  const net = S.cash+S.stock+S.house+S.house2-S.loan-S.loan2;
  const net24 = net * 1.03; // 2023→2024 CPI 折算
  const pct = pctVsReal(S.q, net);
  const q = QUANT[S.q];
  const diff = net - q.med23;
  // 反事实复盘（关键 4 节点）
  const baseSt = replay();
  const base = baseSt.cash+baseSt.stock+baseSt.house+baseSt.house2-baseSt.loan-baseSt.loan2;
  const cfRows = [];
  for(const key of [["house1","1975 买房"],["exit2000","2000 止盈"],["invest2005","2005 投资房"],["crisis2008","2008 金融危机应对"]]){
    const slot = key[0];
    const d = S.choiceSeq.find(x=>x.slot===slot);
    if(!d) continue;
    const alts = [];
    for(let j=0;j<d.opts.length;j++){
      if(j===d.idx) continue;
      const st = replay({slot, idx:j});
      const n = st.cash+st.stock+st.house+st.house2-st.loan-st.loan2;
      alts.push({label:d.opts[j], diff:n-base});
    }
    if(alts.length) cfRows.push({label:key[1], mine:d.label, alts});
  }
  const cfHTML = cfRows.map(r=>`
    <div class="cf"><div class="cft">${r.label} —— 你选了「${r.mine}」</div>
    ${r.alts.map(a=>`<div class="cfr">若「${a.label}」→ <span class="${a.diff>=0?"up":"dn"}">${a.diff>=0?"+":""}${fmt(a.diff)}</span></div>`).join("")}</div>`).join("");
  // 曲线
  const rows = [];
  for(let i=0;i<S.hist.length;i++) if(S.hist[i].y%5===0 || S.hist[i].y===2023) rows.push(S.hist[i]);
  render(`
    <div class="card">
      <h2><span class="yb">2023</span>你的人生结算（${S.age} 岁）</h2>
      <div class="era"><b>54 年真实历史：</b>你经历了 1970s 大通胀、1981 年 16.6% 房贷、1987 崩盘、2000 泡沫、2008 金融危机、2020 疫情。</div>
      <div class="center">
        <div style="font-size:13px;color:var(--sub);">2023 净资产（当年美元）</div>
        <div class="big-num">${fmt(net)} <small>≈ ${fmt(net24)}（2024美元）</small></div>
        <div style="font-size:13px;">${pct!=null?`超过了同起点真实家庭中约 <b style="color:var(--red);font-size:19px;">${pct}%</b> 的人`:""}</div>
        <div class="note">同起点（Q${S.q}）真实家庭 54 年后净资产中位数 ${fmt(q.med23)} —— 你${diff>=0?"高出":"低了"} ${fmt(Math.abs(diff))}</div>
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="k">现金/存款</div><div class="v">${fmt(S.cash)}</div></div>
        <div class="stat"><div class="k">股票/401k</div><div class="v">${fmt(S.stock)}</div></div>
        <div class="stat"><div class="k">房产净值</div><div class="v">${fmt(S.house+S.house2-S.loan-S.loan2)}</div></div>
        <div class="stat"><div class="k">退休时月收入(估)</div><div class="v">${fmt(S.income*(S.married?1.6:1)/12)}</div></div>
        <div class="stat"><div class="k">家庭</div><div class="v" style="font-size:14px;">${S.married?"已婚":"单身"}${S.kid?" · 有孩子":""}</div></div>
        <div class="stat"><div class="k">投资风格</div><div class="v" style="font-size:14px;">${{deposit:"存银行",balanced:"股债平衡",aggressive:"激进炒股"}[S.invest]}</div></div>
      </div>
      <canvas id="chart" width="520" height="180"></canvas>
      <div class="note">▲ 净资产轨迹（1969→2023，当年美元）</div>
      ${S.events.length?`<div class="fate-list"><h3 style="font-size:14px;">🗂 你经历过的历史风浪（${S.events.length} 件）</h3>
        ${S.events.map(e=>`<div class="fl ${e.t.includes("失业")?"warn":e.t.includes("最赚")?"good":""}"><span class="ya">${e.y}年</span> · ${e.t}</div>`).join("")}</div>`:""}
      ${S.choiceSeq.length?`<div class="fate-list"><h3 style="font-size:14px;">📜 历史的回响（事后来看，当年如何）</h3>
        ${S.choiceSeq.map(d=>{const dd=DECISIONS.find(x=>x.slot===d.slot); return dd&&dd.after?`<div class="fl"><span class="ya">${dd.y}年 · ${dd.title}</span><br>${dd.after}</div>`:"";}).join("")}</div>`:""}
      ${cfHTML}
      <div class="cf"><div class="cft">💡 复盘说明</div><div class="cfr">以上为「只改一个选择」的确定性重演（不含失业等运气），真实历史没有后悔药。</div></div>
      <div class="center" style="margin-top:12px;">
        <button class="btn btn-primary" onclick="location.reload()">再活一次</button>
        <button class="btn btn-ghost" onclick="location.href='起点与终点.html'">换起点</button>
      </div>
    </div>`);
  drawChart(rows);
  window.scrollTo(0,0);
}
function replay(override){
  const st = newState();
  st.q = S.q; st.edu = S.edu; st.job = S.job;
  st.income = Math.max(QUANT[S.q].med, 3200) * EDU[S.edu] * JOB[S.job].coef;
  const map = {};
  for(const rec of S.choiceSeq) map[rec.slot] = rec.idx;
  if(override && override.slot) map[override.slot] = override.idx;
  simToEnd(st, map);
  return st;
}
function drawChart(rows){
  const c = document.getElementById("chart");
  if(!c) return;
  const w=c.width, h=c.height, padL=62, padR=12, padT=14, padB=24;
  const ctx = c.getContext("2d");
  const maxV = Math.max(...rows.map(r=>r.net), 1);
  const minV = Math.min(...rows.map(r=>r.net), 0);
  const range = Math.max(maxV-minV, 1);
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="#e5dcc7"; ctx.fillStyle="#8a7d68"; ctx.font="10px serif";
  for(let i=0;i<=4;i++){
    const y = padT + i*(h-padT-padB)/4;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    const v = (maxV - i*range/4)/1000;
    ctx.fillText(v>=100? (v/1000).toFixed(1)+"M" : v.toFixed(0)+"k", 4, y+3);
  }
  const pts = rows.map((r,i)=>[padL + i*(w-padL-padR)/(rows.length-1||1), padT + (1-(r.net-minV)/range)*(h-padT-padB)]);
  ctx.beginPath(); ctx.strokeStyle="#9e3d32"; ctx.lineWidth=2.5; ctx.lineJoin="round";
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke();
  const last = pts[pts.length-1];
  ctx.beginPath(); ctx.arc(last[0],last[1],4,0,Math.PI*2); ctx.fillStyle="#9e3d32"; ctx.fill();
  ctx.fillStyle="#8a7d68";
  rows.forEach((r,i)=>ctx.fillText(r.y+"", pts[i][0]-10, h-8));
}
screenSetup();
</script>
