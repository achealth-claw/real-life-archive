<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>起点与终点 · 54 年后的命运</title>
<style>
  :root{
    --bg:#f4efe4; --card:#fffdf7; --ink:#3b3226; --sub:#8a7d68;
    --red:#a3423b; --line:#e3d9c6; --green:#2e7d5b; --blue:#3a5f8a; --gold:#b8860b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--ink); font-family:"Songti SC","Noto Serif SC","STSong",serif;}
  #app{max-width:640px; margin:0 auto; padding:14px 14px 40px;}
  header.top{text-align:center; padding:20px 0 8px;}
  header.top h1{font-size:24px; letter-spacing:2px; color:var(--red); font-weight:700;}
  header.top .tag{font-size:12px; color:var(--sub); margin-top:6px; line-height:1.7;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 15px; margin-top:12px; box-shadow:0 1px 4px rgba(60,45,20,.06);}
  .btn{display:inline-block; border:none; border-radius:8px; padding:11px 18px; font-size:14px; cursor:pointer; font-family:inherit; margin:4px 4px 0 0;}
  .btn-primary{background:var(--red); color:#fff;}
  .btn-ghost{background:#fff; border:1px solid var(--line); color:var(--ink);}
  .btn:hover{filter:brightness(.96);}
  .center{text-align:center;}
  .note{font-size:11px; color:var(--sub); line-height:1.7; margin-top:8px;}
  .big-num{font-size:30px; font-weight:800; color:var(--red); text-align:center; margin:10px 0 2px;}
  .big-num small{font-size:13px; font-weight:400;}
  /* 起点五等分卡片 */
  .qgrid{display:grid; grid-template-columns:1fr 1fr 1fr 1fr 1fr; gap:8px; margin-top:10px;}
  .qcard{border:1px solid var(--line); background:#fff; border-radius:10px; padding:10px 8px; text-align:center; cursor:pointer; transition:all .12s;}
  .qcard:hover{transform:translateY(-2px); border-color:var(--red);}
  .qcard .qn{font-size:13px; font-weight:700; color:var(--red);}
  .qcard .qi{font-size:11px; color:var(--sub); margin-top:3px; line-height:1.5;}
  .qcard .qn2{font-size:11px; color:var(--blue); margin-top:2px;}
  .qcard .qstat{font-size:10.5px; color:var(--ink); margin-top:5px; border-top:1px dashed var(--line); padding-top:4px; line-height:1.6;}
  /* 命运统计 */
  .fate{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}
  .fate .st{background:#faf6ec; border:1px solid var(--line); border-radius:8px; padding:10px; text-align:center;}
  .fate .st .k{font-size:11px; color:var(--sub);}
  .fate .st .v{font-size:20px; font-weight:800; margin-top:2px;}
  .fate .st .v.up{color:var(--green);} .fate .st .v.down{color:var(--red);} .fate .st .v.stay{color:var(--gold);}
  /* 矩阵 */
  .mx{display:grid; grid-template-columns:52px repeat(5,1fr); gap:3px; margin-top:10px;}
  .mx .cell{background:#f6efe0; border-radius:5px; text-align:center; padding:8px 2px; font-size:12px; cursor:pointer; position:relative; border:1px solid transparent;}
  .mx .cell:hover{border-color:var(--red);}
  .mx .cell b{font-size:14px; display:block;}
  .mx .cell small{font-size:10px; color:var(--sub);}
  .mx .hdr{font-size:11px; color:var(--sub); text-align:center; align-self:center; line-height:1.4;}
  .mx .rhdr{font-weight:700; font-size:12px; color:var(--ink);}
  .mx .cell.myrow{outline:2px solid var(--red); outline-offset:-1px; position:relative;}
  .mx .cell.myrow::before{content:""; position:absolute; left:-4px; top:4px; bottom:4px; width:4px; border-radius:2px; background:var(--red);}
  .mx .rhdr.myrowh{color:var(--red); font-weight:800;}
  .mx .cell.sel{outline:2px solid var(--gold); outline-offset:-1px;}
  .legend{font-size:11px; color:var(--sub); margin-top:6px;}
  /* 样本卡 */
  .smp{display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 13px; margin-top:8px; font-size:12.5px; cursor:pointer; font-family:inherit; color:var(--ink); line-height:1.7;}
  .smp:hover{border-color:var(--red); background:#fdf3e3;}
  .smp b{font-size:13px;}
  .smp .m{color:var(--sub); font-size:11.5px;}
  .rev{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;}
  .rev .rcard{border:1px solid var(--line); border-radius:10px; padding:12px; background:#fff;}
  .rev .rcard h3{font-size:13.5px; margin-bottom:6px;}
  .rev .rcard.bad h3{color:var(--red);} .rev .rcard.good h3{color:var(--green);}
  .rev .smp{margin-top:6px;}
  .foot{text-align:center; font-size:11px; color:var(--sub); margin-top:16px; line-height:1.8;}
  @media (max-width:440px){ .qgrid{grid-template-columns:1fr 1fr;} }
</style>
</head>

      <div class="qgrid">${cards}</div>
      <div class="center" style="margin-top:14px;">
        <button class="btn btn-primary" onclick="randomQ()">🎲 随机选一个起点</button>
        <button class="btn btn-ghost" onclick="screenReverse()">🔄 看「反转人生」</button>
      </div>
    </div>`);
}

/* ====== 视图 2：选起点 → 结果 ====== */
let curQ = null;
function pickQ(q){
  curQ = q;
  const d = M.start_dist[q];
  const rowPct = M.matrix_pct[q];
  // 矩阵热力
  const maxPct = Math.max(...M.matrix_pct.flat());
  let cells = `<div class="hdr"></div>${[0,1,2,3,4].map(j=>`<div class="hdr">终点<br>Q${j+1}<br><small>${QNAMES[j]}</small></div>`).join("")}`;
  for(let i=0;i<5;i++){
    cells += `<div class="hdr rhdr ${i===q?"myrowh":""}">起点 Q${i+1}${i===q?" ← 你":""}</div>`;
    for(let j=0;j<5;j++){
      const pct = M.matrix_pct[i][j];
      const alpha = 0.15 + 0.85 * (pct/maxPct);
      const sel = i===q;
      cells += `<div class="cell ${sel?"myrow":""}" style="background:rgba(163,66,59,${alpha.toFixed(2)})" onclick="pickCell(${i},${j})"><b>${pct}%</b><small>${M.matrix[i][j]}户</small></div>`;
    }
  }
  const sub = Object.values(M.fams).filter(f=>f.q69===q);
  const sorted = sub.slice().sort((a,b)=>a.w23-b.w23);
  const mid = sorted[Math.floor(sorted.length/2)];
  const best = sorted[sorted.length-1], worst = sorted[0];
  const smp = (label, f, cls)=>`
    <button class="smp" onclick="goFam('${f.id}')"><b>${label}</b> · 家族 #${f.id.replace(".0","")} <span class="m">(${f.st69?stName(f.st69):"美国"} · 户主${f.age69!=null?Math.round(f.age69)+"岁":"?"} · 1969收入${fmt(f.inc69_24)}→2023财富${fmt(f.w23_24)})</span></button>`;
  render(`
    <div class="card">
      <h2 style="font-size:16px;">你的起点：1989 年净资产 <span style="color:var(--red);">Q${q+1}（${QNAMES[q]}）</span></h2>
      <div class="note" style="font-size:12.5px;">当年净资产 ${fmt(d.w_lo)}~${fmt(d.w_hi)}（≈2024 年 ${fmt(d.w_avg24)}）· 共 ${d.n} 户家庭从这一起点出发</div>
      <div class="note" style="font-size:11px; margin-bottom:8px;">口径：起点=1989 年<b>净资产</b>等分；终点=2023 年<b>净资产</b>等分。「上升」= 34 年后财富等分高于起点等分（资产→资产，同口径）。</div>
      <div class="fate">
        <div class="st"><div class="k">54 年后上升</div><div class="v up">${d.up_pct}%</div></div>
        <div class="st"><div class="k">原地踏步</div><div class="v stay">${d.stay_pct}%</div></div>
        <div class="st"><div class="k">跌落</div><div class="v down">${d.down_pct}%</div></div>
      </div>
      <div class="note" style="text-align:center; font-size:13px; margin-top:10px;">终点财富中位数 <b style="color:var(--red); font-size:17px;">${fmt(d.w23_med)}</b> <span style="color:var(--sub);">(≈2024 年 ${fmt(d.w23_med24)})</span></div>
      <div class="mx">${cells}</div>
      <div class="legend">▲ 流动性矩阵：行=起点（1989 净资产等分），列=终点（2023 净资产等分），颜色越深比例越高。点任意格子看具体家庭。你的起点行已标红。</div>
      ${mid?`<div style="margin-top:12px;"><div class="note">从这一起点出发的典型人生（点击看 54 年完整档案）：</div>${smp("最差结局", worst)}${smp("中位人生", mid)}${smp("最好结局", best)}</div>`:""}
      <div class="center" style="margin-top:12px;">
        <button class="btn btn-ghost" onclick="screenStart()">← 换一个起点</button>
        <button class="btn btn-primary" onclick="randomQ()">🎲 再来一次</button>
      </div>
    </div>`);
  window.scrollTo(0,0);
}
function randomQ(){ pickQ(Math.floor(Math.random()*5)); }

/* 矩阵格子：该起点×终点组合的家庭 */
function pickCell(i, j){
  const list = Object.values(M.fams).filter(f=>f.q69===i && f.q23===j);
  if(!list.length) return;
  const items = list.slice(0,15).map(f=>`
    <button class="smp" onclick="goFam('${f.id}')"><b>家族 #${f.id.replace(".0","")}</b> <span class="m">· 1969收入 ${fmt(f.inc69_24)} → 2023财富 ${fmt(f.w23_24)}（${f.st69?stName(f.st69):""}${f.age69!=null?" · 户主"+Math.round(f.age69)+"岁":""}）</span></button>`).join("");
  render(`
    <div class="card">
      <h2 style="font-size:16px;">起点 Q${i+1} → 终点 Q${j+1} 的家庭</h2>
      <div class="note" style="font-size:12.5px;">1989 年净资产在 ${QNAMES[i]}、34 年后净资产落在 ${QNAMES[j]} 的家庭，共 ${list.length} 户${i>j?"——他们掉下去了":i<j?"——他们爬上来了":"——他们留在了原地"}。</div>
      ${items}
      <div class="center" style="margin-top:12px;"><button class="btn btn-ghost" onclick="pickQ(${curQ})">← 返回起点 Q${curQ+1}</button></div>
    </div>`);
  window.scrollTo(0,0);
}

/* ====== 视图 3：反转人生 ====== */
function screenReverse(){
  const bad = M.high_start_low_end, good = M.low_start_high_end;
  const mk = (list, cls) => list.map(f=>`
    <button class="smp" onclick="goFam('${f.id}')"><b>家族 #${f.id.replace(".0","")}</b> <span class="m">1969收入 ${fmt(f.inc69_24)} → 2023财富 ${fmt(f.w23_24)}（Q${f.q69+1}→Q${f.q23+1}）</span></button>`).join("");
  render(`
    <div class="card">
      <h2 style="font-size:16px;">🔄 反转人生：起点的悖论</h2>
      <div class="note" style="font-size:12.5px;">起点高，不代表终点高；起点低，也不代表终点低。这些是真实的家族：</div>
      <div class="rev">
        <div class="rcard bad">
          <h3>📉 高开低走<br><small style="color:var(--sub); font-weight:400;">1989 资产最高 40%，2023 净资产落入最低 40%</small></h3>
          ${mk(bad)}
        </div>
        <div class="rcard good">
          <h3>📈 低开高走<br><small style="color:var(--sub); font-weight:400;">1989 资产最低 40%，2023 净资产冲进最高 40%</small></h3>
          ${mk(good)}
        </div>
      </div>
      <div class="note" style="margin-top:10px;">总固化率：${M.meta.sticky_pct}%（34 年后仍留在同一等分的家庭比例；若完全随机应为 20%）。美国梦不是童话，但也不是空话。</div>
      <div class="center" style="margin-top:12px;"><button class="btn btn-ghost" onclick="screenStart()">← 返回起点分布</button></div>
    </div>`);
  window.scrollTo(0,0);
}

/* 跳 v1 档案（跨页面，带 id 参数） */
function goFam(id){
  location.href = "真实人生档案.html?id=" + id.replace(".0","");
}

screenStart();
